name: verify
on: [push, pull_request]

jobs:
  python-tests:
    name: Python Matrix (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/build_skill.py
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m karma validate
      - run: python skills/find-karma/scripts/karma.py find --project examples/python-api --json

  bun-and-adapters:
    name: Bun & Multi-Agent Adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build skill artifacts
        run: python scripts/build_skill.py
      - name: Run Bun tests
        run: bun test
      - name: Verify CLI runner
        run: bun run bin/cli.js doctor
      - name: Verify Universal Installer Dry-Run
        run: ./install.sh --dry-run
