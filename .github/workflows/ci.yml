name: verify
on: [push, pull_request]

jobs:
  python-tests:
    name: Python Matrix (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/seed_catalog.py
      - run: python scripts/build_skill.py
      - name: Reject stale canonical and portable catalogs
        run: git diff --exit-code -- catalog/curated.json src/karma/catalog.json skills/find-karma/assets/catalog.json skills/find-karma/scripts/karma.py src/karma/portable
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m karma validate
      - name: Verify UI-Master portable wheel contents
        if: matrix.python-version == '3.12'
        run: |
          python -m pip wheel --no-deps . -w dist
          python scripts/check_ui_master_wheel.py dist/*.whl
      - run: python skills/find-karma/scripts/karma.py find --project examples/python-api --json

  bun-and-adapters:
    name: Bun & Multi-Agent Adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build skill artifacts
        run: python scripts/build_skill.py
      - name: Run Bun tests
        run: bun test
      - name: Verify CLI runner
        run: bun run bin/cli.js doctor
      - name: Verify Universal Installer Dry-Run
        run: ./install.sh --dry-run

  mcp-protocol:
    name: MCP stdio protocol (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional official SDK
        run: python -m pip install '.[mcp]'
      - name: Run real MCP client/server tests
        run: KARMA_TEST_STDIO=1 python -m unittest discover -s tests -p 'test_mcp*.py' -v

  ui-master-native:
    name: UI-Master Rust and launcher smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build generated portable launcher
        run: python scripts/build_skill.py
      - name: Check Rust engine
        run: cargo test --locked --manifest-path crates/ui-master-engine/Cargo.toml
      - name: Build native engine
        run: cargo build --locked --manifest-path crates/ui-master-engine/Cargo.toml
      - name: Exercise real shell launcher and native MCP stdio
        run: UIM_TEST_RUST=1 PYTHONPATH=src python -m unittest discover -s tests -p 'test_ui_master_native.py' -v
